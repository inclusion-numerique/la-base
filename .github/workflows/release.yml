---
name: Release

on:
  push:
    branches:
      - 'main'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-dev:
    name: Build dev
    uses: ./.github/workflows/build.reusable.yml
    with:
      environnement: dev
    secrets: inherit

  build-production:
    name: Build production
    uses: ./.github/workflows/build.reusable.yml
    with:
      environnement: main
    secrets: inherit

  deploy-dev:
    name: Deploy dev
    needs: build-dev
    uses: ./.github/workflows/deploy.reusable.yml
    with:
      environnement: dev
      namespace: ${{ needs.build-dev.outputs.namespace }}
      environnement-github: ${{ needs.build-dev.outputs.environnement }}
      image: ${{ needs.build-dev.outputs.image }}
    permissions:
      contents: read
      deployments: write
    secrets: inherit

  deploy-production:
    name: Deploy production
    needs: [build-production, deploy-dev]
    uses: ./.github/workflows/deploy.reusable.yml
    with:
      environnement: main
      namespace: ${{ needs.build-production.outputs.namespace }}
      environnement-github: ${{ needs.build-production.outputs.environnement }}
      image: ${{ needs.build-production.outputs.image }}
    permissions:
      contents: read
      deployments: write
    secrets: inherit

  prune-registry:
    name: Prune registry
    needs: deploy-production
    if: ${{ !cancelled() && needs.deploy-production.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup
        uses: ./.github/actions/setup
      - name: Secrets environment
        uses: ./.github/actions/secrets-env
        with:
          scw-access-key: ${{ secrets.SCW_ACCESS_KEY }}
          scw-secret-key: ${{ secrets.SCW_SECRET_KEY }}
      - name: Delete orphan images and old main and dev tags
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm --silent cli infrastructure:prune-registry --apply
