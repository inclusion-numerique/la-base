---
name: Deploy

on:
  push:
    branches:
      - 'dev'
      - 'main'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    if: contains(fromJSON('["dev", "main"]'), github.ref_name)
    uses: ./.github/workflows/build.reusable.yml
    with:
      environnement: ${{ github.ref_name }}
    secrets: inherit

  deploy:
    name: Deploy
    needs: build
    uses: ./.github/workflows/deploy.reusable.yml
    with:
      environnement: ${{ github.ref_name }}
      namespace: ${{ needs.build.outputs.namespace }}
      environnement-github: ${{ needs.build.outputs.environnement }}
      image: ${{ needs.build.outputs.image }}
    permissions:
      contents: read
      deployments: write
    secrets: inherit
