---
name: CI

on:
  push:
    branches:
      - 'build/*'
      - 'chore/*'
      - 'ci/*'
      - 'docs/*'
      - 'feat/*'
      - 'fix/*'
      - 'perf/*'
      - 'refactor/*'
      - 'revert/*'
      - 'style/*'
      - 'test/*'
      - 'dev'
      - 'main'

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-lint
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup
        uses: ./.github/actions/setup
      - name: Monorepo manypkg check
        run: pnpm manypkg check
      - name: Tsc
        run: pnpm tsc
      - name: Lint all packages except @app/web
        run: pnpm -F '!@app/web' lint
      - name: Lint @app/web
        run: pnpm -F '@app/web' lint

  test-packages:
    name: Test packages
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-test-packages
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup
        uses: ./.github/actions/setup
      - name: Create env file
        run: cp .env.dist .env
      - name: Test all packages except @app/web with coverage
        run: pnpm -F '!la-base' -F '!@app/web' -F '!@app/e2e' -F '!@app/storybook' exec jest --coverage --passWithNoTests
      - name: List coverage reports
        id: coverage
        run: |
          shopt -s nullglob
          files=(apps/*/coverage/lcov.info packages/*/coverage/lcov.info)
          echo "files=${files[*]}" >> "$GITHUB_OUTPUT"
      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          files: ${{ steps.coverage.outputs.files }}
          flag-name: packages
          parallel: true
          fail-on-error: false

  test-web:
    name: Test web
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-test-web
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup
        uses: ./.github/actions/setup
      - name: Create env file
        run: cp .env.dist .env
      - name: Test @app/web with coverage
        run: pnpm --silent -F @app/web exec jest --coverage -c jest.unit.config.ts
      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          files: apps/web/coverage/lcov.info
          flag-name: web-unit
          parallel: true
          fail-on-error: false

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-integration-tests
      cancel-in-progress: true
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      maildev:
        image: maildev/maildev:2.2.1
        env:
          MAILDEV_INCOMING_USER: mailuser
          MAILDEV_INCOMING_PASS: mailpassword
        ports:
          - 1025:1025
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup
        uses: ./.github/actions/setup
      - name: Test environment
        uses: ./.github/actions/test-env
        with:
          scw-access-key: ${{ secrets.SCW_ACCESS_KEY }}
          scw-secret-key: ${{ secrets.SCW_SECRET_KEY }}
      - name: Load fixtures
        run: pnpm -F @app/fixtures load
      - name: Run web integration tests with coverage
        run: |
          set -a
          source .env
          set +a
          pnpm --silent -F @app/web exec jest --coverage -c jest.integration.config.ts --runInBand
      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          files: apps/web/coverage/lcov.info
          flag-name: web-integration
          parallel: true
          fail-on-error: false

  chromatic:
    name: Chromatic
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-chromatic
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup
        uses: ./.github/actions/setup
      - name: Secrets environment
        uses: ./.github/actions/secrets-env
        with:
          scw-access-key: ${{ secrets.SCW_ACCESS_KEY }}
          scw-secret-key: ${{ secrets.SCW_SECRET_KEY }}
      - name: Build storybook and deploy on chromatic
        run: pnpm --silent -F @app/storybook chromatic

  infrastructure-diff:
    name: Infrastructure diff (${{ matrix.branche }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        branche:
          - dev
          - main
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-infrastructure-diff-${{ matrix.branche }}
      cancel-in-progress: true
    env:
      CDK_FORCE_BRANCH: ${{ matrix.branche }}
      NAMESPACE: ${{ matrix.branche }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup
        uses: ./.github/actions/setup
        with:
          node-version: '22'
      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.13.1
          tofu_wrapper: false
      - name: Secrets environment
        uses: ./.github/actions/secrets-env
        with:
          scw-access-key: ${{ secrets.SCW_ACCESS_KEY }}
          scw-secret-key: ${{ secrets.SCW_SECRET_KEY }}
      - name: Deployed image and database password
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_NUMBER=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy.yml --branch "$CDK_FORCE_BRANCH" --status success --limit 1 --json number --jq '.[0].number')
          echo "WEB_CONTAINER_IMAGE=rg.fr-par.scw.cloud/la-base-web-app/la-base-web-$NAMESPACE:$RUN_NUMBER" >> "$GITHUB_ENV"
          DATABASE_PASSWORD=$(pnpm --silent cli secrets:database-password "$NAMESPACE")
          echo "::add-mask::$DATABASE_PASSWORD"
          echo "DATABASE_PASSWORD=$DATABASE_PASSWORD" >> "$GITHUB_ENV"
      - name: Create terraform variables file from environment variables
        run: pnpm --silent cli terraform:vars-from-env web
      - name: Compute diff
        run: pnpm --silent -F @app/cdk cdktf diff web --var-file .tfvars.json

  coverage:
    name: Coverage
    needs:
      - test-packages
      - test-web
      - integration-tests
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Close parallel Coveralls build
        uses: coverallsapp/github-action@v2
        with:
          parallel-finished: true
          carryforward: 'packages,web-unit,web-integration'
          fail-on-error: false
