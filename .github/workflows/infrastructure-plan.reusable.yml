---
name: Infrastructure plan

on:
  workflow_call:
    inputs:
      environnement:
        description: 'Branch whose environment to plan'
        type: string
        required: true
    outputs:
      changes:
        description: 'Whether the plan changes the infrastructure beyond sensitivity marks'
        value: ${{ jobs.plan.outputs.changes }}

permissions:
  contents: read

env:
  ENVIRONNEMENT: ${{ inputs.environnement }}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      changes: ${{ steps.plan.outputs.changes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup
        uses: ./.github/actions/setup
      - name: Secrets environment
        uses: ./.github/actions/secrets-env
        with:
          scw-access-key: ${{ secrets.SCW_ACCESS_KEY }}
          scw-secret-key: ${{ secrets.SCW_SECRET_KEY }}
      - name: Export database password
        run: |
          DATABASE_PASSWORD=$(pnpm --silent cli secrets:database-password "$ENVIRONNEMENT")
          echo "::add-mask::$DATABASE_PASSWORD"
          echo "DATABASE_PASSWORD=$DATABASE_PASSWORD" >> "$GITHUB_ENV"
      - name: Create infrastructure variables file from environment variables
        run: WEB_CONTAINER_IMAGE='placeholder_for_plan' pnpm --silent cli infrastructure:vars-from-env
      - name: Infrastructure
        uses: ./.github/actions/infrastructure
        with:
          namespace: ${{ inputs.environnement }}
      - name: Plan against the deployed image
        id: plan
        run: |
          IMAGE=$(pnpm --silent with-env tofu -chdir=infrastructure output -raw webContainerImage)
          WEB_CONTAINER_IMAGE="$IMAGE" pnpm --silent cli infrastructure:vars-from-env
          pnpm --silent with-env tofu -chdir=infrastructure plan -input=false -var-file=.tfvars.json -var "branch=$ENVIRONNEMENT" -var "namespace=$ENVIRONNEMENT" -out=plan.tfplan
          pnpm --silent with-env tofu -chdir=infrastructure show -json plan.tfplan > plan.json
          pip install --quiet argon2-cffi
          STATUS=0
          python3 .github/scripts/infrastructure-plan-check.py plan.json > plan-check.txt || STATUS=$?
          cat plan-check.txt
          {
            echo "## Plan de l'infrastructure $ENVIRONNEMENT"
            echo
            echo '```'
            if [ -s plan-check.txt ]; then cat plan-check.txt; else echo "Aucun changement"; fi
            echo '```'
            echo
            echo '<details><summary>Plan complet</summary>'
            echo
            echo '```'
            pnpm --silent with-env tofu -chdir=infrastructure show -no-color plan.tfplan
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f plan.json plan-check.txt infrastructure/plan.tfplan
          case "$STATUS" in
            0) echo "changes=false" >> "$GITHUB_OUTPUT" ;;
            10) echo "changes=true" >> "$GITHUB_OUTPUT" ;;
            *) exit "$STATUS" ;;
          esac
