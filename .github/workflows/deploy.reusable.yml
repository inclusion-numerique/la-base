---
name: Deploy

on:
  workflow_call:
    inputs:
      environnement:
        description: 'Branch whose environment to deploy'
        type: string
        required: true
      environnement-github:
        description: 'GitHub environment name of the branch'
        type: string
        required: true
      image:
        description: 'Container image to deploy'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environnement }}
  cancel-in-progress: false

env:
  BRANCHE: ${{ inputs.environnement }}

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    environment:
      name: ${{ inputs.environnement-github }}
      url: ${{ steps.status.outputs.url }}
    env:
      ENVIRONNEMENT: ${{ inputs.environnement-github }}
      WEB_CONTAINER_IMAGE: ${{ inputs.image }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Setup
        uses: ./.github/actions/setup
      - name: Secrets environment
        uses: ./.github/actions/secrets-env
        with:
          scw-access-key: ${{ secrets.SCW_ACCESS_KEY }}
          scw-secret-key: ${{ secrets.SCW_SECRET_KEY }}
      - name: Setup and export database password
        run: |
          pnpm --silent cli secrets:database:setup "$ENVIRONNEMENT"
          DATABASE_PASSWORD=$(pnpm --silent cli secrets:database-password "$ENVIRONNEMENT")
          echo "::add-mask::$DATABASE_PASSWORD"
          echo "DATABASE_PASSWORD=$DATABASE_PASSWORD" >> "$GITHUB_ENV"
      - name: Create infrastructure variables file from environment variables
        run: pnpm --silent cli infrastructure:vars-from-env
      - name: Infrastructure
        uses: ./.github/actions/infrastructure
        with:
          namespace: ${{ inputs.environnement-github }}
      - name: Apply infrastructure
        run: |
          pnpm --silent with-env tofu -chdir=infrastructure apply -input=false -auto-approve -var-file=.tfvars.json -var "branch=$BRANCHE" -var "namespace=$ENVIRONNEMENT"
          pnpm --silent with-env tofu -chdir=infrastructure output -json > infrastructure/outputs.json
      - name: Add infrastructure outputs to env file
        run: pnpm --silent cli dotenv:from-infrastructure
      - name: Mask env file values
        uses: ./.github/actions/mask-env
      - name: Install PostgreSQL 17 client
        if: env.BRANCHE != 'main'
        run: |
          wget -qO- https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/postgresql-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql-archive-keyring.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - name: Import main database dump
        if: env.BRANCHE != 'main'
        run: |
          set -a
          source .env
          set +a
          pnpm --silent cli backup:locally-restore-latest-main
      - name: Migrate database
        run: |
          set -a
          source .env
          set +a
          pnpm --silent -F @app/web prisma migrate deploy
      - name: Load fixtures
        if: env.BRANCHE != 'main'
        run: |
          set -a
          source .env
          set +a
          pnpm --silent -F @app/fixtures load
      - name: Check that deployed container status is ok
        id: status
        run: |
          set -a
          source .env
          set +a
          pnpm --silent cli deployment:check-status "https://$WEB_BASE_URL"
          echo "url=https://$WEB_BASE_URL" >> "$GITHUB_OUTPUT"
