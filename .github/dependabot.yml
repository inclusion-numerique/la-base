version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Paris
    cooldown:
      default-days: 15
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm-mineures-et-correctifs:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Paris
    cooldown:
      default-days: 15
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - '*'
